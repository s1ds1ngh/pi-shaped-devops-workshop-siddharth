name: CI/CD Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bandit_scan:
    name: Bandit - Python SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install bandit
      - run: bandit -r Security_Compliance_workshop-siddharth -f html -o bandit-report.html || true
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report.html
          path: bandit-report.html

  semgrep_scan:
    name: Semgrep - SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: docker run --rm -v ${{ github.workspace }}/Security_Compliance_workshop-siddharth:/src returntocorp/semgrep semgrep --config=auto --json --output=/src/semgrep-report.json /src || true
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report.json
          path: Security_Compliance_workshop-siddharth/semgrep-report.json

  gitleaks_scan:
    name: Gitleaks - Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: docker run --rm -v ${{ github.workspace }}/Security_Compliance_workshop-siddharth:/repo zricethezav/gitleaks:latest detect --source=/repo --report-format=json --report-path=/repo/gitleaks-report.json || true
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report.json
          path: Security_Compliance_workshop-siddharth/gitleaks-report.json

  zap_scan:
    name: OWASP ZAP - DAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          cat <<'EOF' > docker-compose.yml
          version: '3.8'
          services:
            flask:
              build: ./Security_Compliance_workshop-siddharth
              ports:
                - "5000:5000"
            zap:
              image: ghcr.io/zaproxy/zaproxy:stable
              depends_on:
                - flask
              command: >
                zap-baseline.py
                -t http://flask:5000
                -r zap-report.html
              volumes:
                - ./Security_Compliance_workshop-siddharth:/zap/wrk
          EOF

      - name: Run Flask + ZAP
        run: docker compose up --abort-on-container-exit

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report.html
          path: Security_Compliance_workshop-siddharth/zap-report.html
