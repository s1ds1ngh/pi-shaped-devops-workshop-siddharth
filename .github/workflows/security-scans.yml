name: Security Scanning Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  bandit_scan:
    name: Run Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r Security_Compliance_workshop-siddharth/Day3/requirements.txt bandit
      - name: Run Bandit SAST scan
        run: |
          bandit -r Security_Compliance_workshop-siddharth/Day3 -f html -o bandit-report.html
      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.html

  semgrep_scan:
    name: Run Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'p/default'
          generateSarif: true
      - name: Upload Semgrep SARIF
        uses: actions/upload-artifact@v3
        with:
          name: semgrep-results
          path: semgrep.sarif

  gitleaks_scan:
    name: Run Gitleaks (Secrets scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "--report-format json --report-path=gitleaks-report.json"
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v3
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  zap_scan:
    name: Run OWASP ZAP (DAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python and install Flask app
        run: |
          pip install -r Security_Compliance_workshop-siddharth/Day3/requirements.txt
          nohup python Security_Compliance_workshop-siddharth/Day3/app.py &
          sleep 10
      - name: Run ZAP Baseline scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:5000'
          report: true
          cmd_options: '-a'
      - name: Upload ZAP report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: report_html.html
