name: Security Scanning Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  bandit-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      # Run bandit in the subdirectory where the python code is located
      run: bandit -r . -f html -o bandit-report.html || true
      working-directory: ./Security_Compliance_workshop-siddharth/Day3

    - name: Upload Bandit Report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: Security_Compliance_workshop-siddharth/Day3/bandit-report.html

  semgrep-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Semgrep Scan
      uses: returntocorp/semgrep-action@v1
      with:
        # Scan the specific subdirectory
        config: >-
          p/default
          p/python
        include: "Security_Compliance_workshop-siddharth/Day3/"

    - name: Upload Semgrep SARIF
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-sarif
        path: semgrep.sarif

  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Important for gitleaks to scan full history

    - name: Run Gitleaks Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true # Action will automatically upload report

  owasp-zap-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: pip install -r requirements.txt
      working-directory: ./Security_Compliance_workshop-siddharth/Day3

    - name: Start Flask App in background
      run: python app.py &
      working-directory: ./Security_Compliance_workshop-siddharth/Day3

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.11.0
      with:
        target: 'http://127.0.0.1:8080/'
        cmd_options: '-r zap-report.html'

    - name: Upload ZAP Report
      uses: actions/upload-artifact@v4
      with:
        name: zap-report
        path: zap-report.html