name: CI/CD Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bandit_scan:
    name: Bandit - Python SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install bandit
      - run: bandit -r Security_Compliance_workshop_siddharth -f html -o bandit-report.html || true
      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report.html
          path: bandit-report.html

  semgrep_scan:
    name: Semgrep - SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: docker run --rm -v ${{ github.workspace }}/Security_Compliance_workshop_siddharth:/src returntocorp/semgrep semgrep --config=auto --json --output=/src/semgrep-report.json /src || true
      - name: Upload Semgrep report
        uses: actions/upload-artifact@v3
        with:
          name: semgrep-report.json
          path: Security_Compliance_workshop_siddharth/semgrep-report.json

  gitleaks_scan:
    name: Gitleaks - Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: docker run --rm -v ${{ github.workspace }}/Security_Compliance_workshop_siddharth:/repo zricethezav/gitleaks:latest detect --source=/repo --report-format=json --report-path=/repo/gitleaks-report.json || true
      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v3
        with:
          name: gitleaks-report.json
          path: Security_Compliance_workshop_siddharth/gitleaks-report.json

  zap_scan:
    name: OWASP ZAP - DAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Start Flask app
        run: |
          cd Security_Compliance_workshop_siddharth
          pip install -r requirements.txt
          nohup python app.py &
          sleep 30
      - name: Run ZAP Baseline Scan
        run: |
          docker run --network host -v ${{ github.workspace }}/Security_Compliance_workshop_siddharth:/zap/wrk owasp/zap2docker-stable zap-baseline.py -t http://localhost:5000 -r zap-report.html || true
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report.html
          path: Security_Compliance_workshop_siddharth/zap-report.html
