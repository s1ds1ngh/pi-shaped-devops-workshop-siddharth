stages:
  - bandit_scan
  - semgrep_scan
  - gitleaks_scan
  - dast

variables:
  GIT_DEPTH: 0

# Bandit SAST Scanning for Python Security Issues
bandit_scan:
  stage: bandit_scan
  image: python:3.9-slim
  before_script:
    - pip install bandit
  script:
    - bandit -r . -f html -o bandit-report.html || true
    - bandit -r . -f txt || true
  artifacts:
    paths:
      - bandit-report.html
    when: always
    expire_in: 1 week
  allow_failure: true

# Semgrep SAST Scanning
semgrep_scan:
  stage: semgrep_scan
  image: returntocorp/semgrep:latest
  script:
    - semgrep --config=auto --json --output=semgrep-report.json . || true
    - semgrep --config=auto . || true
  artifacts:
    paths:
      - semgrep-report.json
    when: always
    expire_in: 1 week
  allow_failure: true

# Gitleaks Secret Detection
gitleaks_scan:
  stage: gitleaks_scan
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --report-format=json --report-path=gitleaks-report.json --verbose || true
  artifacts:
    paths:
      - gitleaks-report.json
    when: always
    expire_in: 1 week
  allow_failure: true

# OWASP ZAP DAST Scanning
zap_scan:
  stage: dast
  image: owasp/zap2docker-stable
  services:
    - name: python:3.9-slim
      alias: flask-app
      command: ["sh", "-c", "pip install Flask requests && python -c \"from flask import Flask, request, render_template_string; app = Flask(__name__); app.config['SECRET_KEY'] = 'test'; @app.route('/') def index(): return '<h1>Hello World</h1>'; @app.route('/ping') def ping(): return '<form><input name=ip><button>Ping</button></form>'; app.run(host='0.0.0.0', port=5000)\""]
  before_script:
    - mkdir -p /zap/wrk
  script:
    - sleep 30
    - zap-baseline.py -t http://flask-app:5000 -r /zap/wrk/zap-report.html -I || true
    - cp /zap/wrk/zap-report.html zap-report.html
  artifacts:
    paths:
      - zap-report.html
    when: always
    expire_in: 1 week
  allow_failure: true
